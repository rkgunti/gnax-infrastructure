database:
  namespace: dev-db

mysql:
  enabled: true
  database: devdb
  user: devuser
  pvc:
    name: mysql-pvc
    size: 8Gi
  service:
    type: NodePort
    port: 3306
    nodePort: 30306

mongodb:
  enabled: true
  rootUser: root
  username: devuser
  database: devdb
  pvc:
    name: mongo-pvc
    size: 10Gi
  service:
    type: NodePort
    port: 27017
    nodePort: 30017
