{{- if .Values.kafka.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Values.kafka.pvc.name }}
  namespace: {{ .Release.Namespace }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.kafka.pvc.size }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      containers:
        - name: kafka
          image: "{{ .Values.kafka.image.repository }}:{{ .Values.kafka.image.tag }}"
          ports:
            - name: internal
              containerPort: {{ .Values.kafka.service.internalPort }}
            - name: external
              containerPort: {{ .Values.kafka.service.externalPort }}
            - name: controller
              containerPort: {{ .Values.kafka.service.controllerPort }}
          env:
            - name: CLUSTER_ID
              value: MkU3OEVBNTcwNTJENDM2Qk
            - name: KAFKA_NODE_ID
              value: "1"
            - name: KAFKA_PROCESS_ROLES
              value: broker,controller
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: 1@kafka:{{ .Values.kafka.service.controllerPort }}
            - name: KAFKA_LISTENERS
              value: INTERNAL://:{{ .Values.kafka.service.internalPort }},EXTERNAL://:{{ .Values.kafka.service.externalPort }},CONTROLLER://:{{ .Values.kafka.service.controllerPort }}
            - name: KAFKA_ADVERTISED_LISTENERS
              value: INTERNAL://kafka:{{ .Values.kafka.service.internalPort }},EXTERNAL://localhost:{{ .Values.kafka.service.nodePort }}
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: INTERNAL
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: CONTROLLER
            - name: KAFKA_AUTO_CREATE_TOPICS_ENABLE
              value: "true"
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "1"
          volumeMounts:
            - name: kafka-data
              mountPath: /var/lib/kafka/data
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1
              memory: 1Gi
      volumes:
        - name: kafka-data
          persistentVolumeClaim:
            claimName: {{ .Values.kafka.pvc.name }}
---
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: kafka
  type: {{ .Values.kafka.service.type }}
  ports:
    - name: kafka-internal
      port: {{ .Values.kafka.service.internalPort }}
      targetPort: internal
      protocol: TCP
    - name: kafka-external
      port: {{ .Values.kafka.service.externalPort }}
      targetPort: external
      protocol: TCP
      {{- if eq .Values.kafka.service.type "NodePort" }}
      nodePort: {{ .Values.kafka.service.nodePort }}
      {{- end }}
    - name: kafka-controller
      port: {{ .Values.kafka.service.controllerPort }}
      targetPort: controller
      protocol: TCP
{{- end }}