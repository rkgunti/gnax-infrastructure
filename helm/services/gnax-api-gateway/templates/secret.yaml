apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.gateway.secretName }}
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  CONFIG_SERVER_USERNAME: {{ required "gateway.configServerUsername is required; provide the local gnax-api-gateway secret values file" .Values.gateway.configServerUsername | quote }}
  CONFIG_SERVER_PASSWORD: {{ required "gateway.configServerPassword is required; provide the local gnax-api-gateway secret values file" .Values.gateway.configServerPassword | quote }}
