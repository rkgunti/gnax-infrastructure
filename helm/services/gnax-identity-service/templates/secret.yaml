apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.identity.secretName }}
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  CONFIG_SERVER_USERNAME: {{ required "identity.configServerUsername is required; provide the local gnax-identity-service secret values file" .Values.identity.configServerUsername | quote }}
  CONFIG_SERVER_PASSWORD: {{ required "identity.configServerPassword is required; provide the local gnax-identity-service secret values file" .Values.identity.configServerPassword | quote }}
