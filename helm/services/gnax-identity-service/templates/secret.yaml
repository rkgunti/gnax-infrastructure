apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.identity.secretName }}
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  DB_USER: {{ required "identity.dbUser is required; provide the local gnax-identity-service secret values file" .Values.identity.dbUser | quote }}
  DB_USER_PASSWORD: {{ required "identity.dbUserPassword is required; provide the local gnax-identity-service secret values file" .Values.identity.dbUserPassword | quote }}
  JWT_PRIVATE_KEY: {{ required "identity.jwtPrivateKey is required; provide the local gnax-identity-service secret values file" .Values.identity.jwtPrivateKey | quote }}
  JWT_PUBLIC_KEY: {{ required "identity.jwtPublicKey is required; provide the local gnax-identity-service secret values file" .Values.identity.jwtPublicKey | quote }}
  CONFIG_SERVER_USERNAME: {{ required "identity.configServerUsername is required; provide the local gnax-identity-service secret values file" .Values.identity.configServerUsername | quote }}
  CONFIG_SERVER_PASSWORD: {{ required "identity.configServerPassword is required; provide the local gnax-identity-service secret values file" .Values.identity.configServerPassword | quote }}
