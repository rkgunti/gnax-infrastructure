# Kubernetes resource name; the Service is reachable as <name>.<namespace>.svc.cluster.local
name: config-server

replicaCount: 1

image:
  repository: gnax-config-server
  tag: "0.0.1-SNAPSHOT"
  pullPolicy: IfNotPresent

# Secret created by helm/services/config-server (CONFIG_SERVER_USERNAME, CONFIG_SERVER_PASSWORD, CONFIG_GIT_URI)
secretName: config-server-secret

service:
  type: ClusterIP
  port: 8888
  # Only used when type is NodePort (host access from browser/IDE)
  nodePort: null

resources:
  requests:
    cpu: 100m
    memory: 384Mi
  limits:
    memory: 768Mi

probes:
  startup:
    failureThreshold: 30
    periodSeconds: 5
