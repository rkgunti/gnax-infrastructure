apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.configServer.secretName }}
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  CONFIG_SERVER_USERNAME: {{ required "configServer.username is required; provide the local config-server secret values file" .Values.configServer.username | quote }}
  CONFIG_SERVER_PASSWORD: {{ required "configServer.password is required; provide the local config-server secret values file" .Values.configServer.password | quote }}
  CONFIG_GIT_URI: {{ required "configServer.gitUri is required; provide the local config-server secret values file" .Values.configServer.gitUri | quote }}
  ENCRYPT_KEY: {{ required "configServer.encryptKey is required; provide the local config-server secret values file" .Values.configServer.encryptKey | quote }}
